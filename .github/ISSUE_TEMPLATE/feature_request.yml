name: Feature request
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. Features that add permissions, audio capture, ASR/OCR, cloud services, accounts, billing, publishing, or bulk subtitle collection require an explicit privacy and scope review.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the expected behavior and user-visible result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Permissions, privacy, compatibility, and cost
      description: Note any new browser permissions, external services, user data, provider costs, or site-specific maintenance.
